<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Electrónica Oficial</title>
    <!-- Firebase SDK (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .grid-boletos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .ticket {
            background: #e2e8f0;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ticket:hover:not(:disabled) {
            background: #cbd5e1;
        }

        .ticket.disponible {
            background: #dcfce7;
            color: #166534;
        }

        .ticket.seleccionado {
            background: var(--primary);
            color: white;
        }

        .ticket.ocupado {
            background: #fee2e2;
            color: #991b1b;
            cursor: not-allowed;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .ticket-tag {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button[type="submit"]:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .search-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gran Rifa Electrónica</h1>
        <p>Selecciona tu número de la suerte y participa.</p>
    </header>

    <main class="container">
        <section class="panel">
            <h2>1. Elige tu número</h2>
            <div class="search-box">
                <input type="text" id="buscador" placeholder="Buscar número...">
            </div>
            <div id="grid-boletos" class="grid-boletos">
                <!-- Los boletos se generan dinámicamente -->
            </div>
        </section>

        <section class="panel formulario-panel">
            <h2>2. Completa tus datos</h2>
            <form id="form-ticket">
                <input type="hidden" id="selected-ticket" required>
                <div class="input-group">
                    <label>Número Seleccionado:</label>
                    <span id="display-ticket" class="ticket-tag">Ninguno</span>
                </div>
                <div class="input-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="input-group">
                    <label for="telefono">Teléfono / WhatsApp:</label>
                    <input type="tel" id="telefono" required placeholder="Ej. 809-000-0000">
                </div>
                <button type="submit" id="btn-reservar" disabled>Apartar Número</button>
            </form>
        </section>
    </main>

    <script>
        // Configuración de Firebase integrada con tus credenciales reales
        const firebaseConfig = {
            apiKey: "AIzaSyAMPBDfxYr6sqa1u0UimHCqZLqh8QysqQY",
            authDomain: "rifa-bb67f.firebaseapp.com",
            databaseURL: "https://rifa-bb67f-default-rtdb.firebaseio.com",
            projectId: "rifa-bb67f",
            storageBucket: "rifa-bb67f.firebasestorage.app",
            messagingSenderId: "323732354104",
            appId: "1:323732354104:web:df905e7ef9b8cd5587e2cd",
            measurementId: "G-95ESCE2ST3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TOTAL_BOLETOS = 100; 
        let numeroSeleccionado = null;

        const gridBoletos = document.getElementById('grid-boletos');
        const selectedInput = document.getElementById('selected-ticket');
        const displayTicket = document.getElementById('display-ticket');
        const btnReservar = document.getElementById('btn-reservar');
        const formTicket = document.getElementById('form-ticket');
        const buscador = document.getElementById('buscador');

        function inicializarRifa() {
            gridBoletos.innerHTML = '';
            
            db.ref('boletos').on('value', (snapshot) => {
                const datosBoletos = snapshot.val() || {};
                gridBoletos.innerHTML = '';

                for (let i = 0; i < TOTAL_BOLETOS; i++) {
                    const numeroStr = String(i).padStart(3, '0');
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'ticket';
                    btn.textContent = numeroStr;

                    if (datosBoletos[numeroStr]) {
                        btn.classList.add('ocupado');
                        btn.disabled = true;
                        btn.title = `Ocupado por ${datosBoletos[numeroStr].nombre}`;
                    } else {
                        btn.classList.add('disponible');
                        btn.onclick = () => seleccionarBoleto(numeroStr, btn);
                    }

                    gridBoletos.appendChild(btn);
                }
            });
        }

        function seleccionarBoleto(numero, elemento) {
            document.querySelectorAll('.ticket').forEach(t => {
                if(!t.classList.contains('ocupado')) t.classList.remove('seleccionado');
            });
            
            elemento.classList.add('seleccionado');
            numeroSeleccionado = numero;
            selectedInput.value = numero;
            displayTicket.textContent = `#${numero}`;
            btnReservar.disabled = false;
        }

        formTicket.onsubmit = (e) => {
            e.preventDefault();
            if (!numeroSeleccionado) return;

            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const boletoRef = db.ref(`boletos/${numeroSeleccionado}`);
            
            boletoRef.transaction((currentData) => {
                if (currentData === null) {
                    return { nombre, telefono, fecha: Date.now() };
                } else {
                    return; 
                }
            }, (error, committed) => {
                if (error) {
                    alert("Error al procesar la reserva. Intente de nuevo.");
                } else if (!committed) {
                    alert("¡Lo siento! Este número acaba de ser seleccionado por otra persona.");
                } else {
                    alert(`¡Boleto #${numeroSeleccionado} apartado con éxito!`);
                    formTicket.reset();
                    displayTicket.textContent = "Ninguno";
                    btnReservar.disabled = true;
                    numeroSeleccionado = null;
                }
            });
        };

        buscador.oninput = (e) => {
            TheFiltro = e.target.value;
            document.querySelectorAll('.ticket').forEach(btn => {
                if (btn.textContent.includes(e.target.value)) {
                    btn.style.display = 'block';
                } else {
                    btn.style.display = 'none';
                }
            });
        };

        window.onload = inicializarRifa;
    </script>
</body>
</html>
